[package]
name = "linuxward"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Linux desktop app to clean up disk space, manage packages, scan for exposed secrets and suspicious processes, and tune performance"
license = "MPL-2.0"
repository = "https://github.com/CodeSharkOSS/linux-ward"
readme = "README.md"
keywords = ["linux", "cleanup", "security", "gui", "system"]
categories = ["gui", "os::linux-apis"]

[dependencies]
eframe = "0.37.0"
egui_extras = "0.37.0"
libc = "0.2.191"
trash = "5.3.0"
walkdir = "2.5.0"
